<!DOCTYPE html>

<html>
<head>
    <title>HCIBS SJ Passdown</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: coral;
        min-height: 100vh;
    }

    /* Top bar */
    .top-bar {
        height: 70px;
        background: white;
        display: flex;
        align-items: center;
        padding: 0 25px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }

    /* Dropdown menu */
    .menu {
        position: relative;
    }

    .menu-button {
        background: coral;
        color: white;
        border: none;
        border-radius: 8px;
        padding: 12px 18px;
        font-size: 16px;
        cursor: pointer;
    }

    .dropdown {
        display: none;
        position: absolute;
        top: 48px;
        left: 0;
        background: white;
        width: 220px;
        border-radius: 10px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        overflow: hidden;
        z-index: 10;
    }

    .menu:hover .dropdown {
        display: block;
    }

    .dropdown-section {
        padding: 12px 15px;
        font-weight: bold;
        color: coral;
        border-bottom: 1px solid #eee;
    }

    .dropdown a {
        display: block;
        padding: 10px 15px;
        text-decoration: none;
        color: #444;
    }

    .dropdown a:hover {
        background: #f5f5f5;
    }

    /* Main content */
    .content {
        padding: 40px;
        text-align: center;
    }

    .content h1 {
        color: white;
        font-size: 36px;
        margin-bottom: 10px;
    }

    .content p {
        color: white;
        font-size: 18px;
    }

    /* Plus button */
    .plus-button {
        position: fixed;
        right: 30px;
        bottom: 30px;
        width: 60px;
        height: 60px;
        border-radius: 50%;
        border: none;
        background: white;
        color: coral;
        font-size: 35px;
        cursor: pointer;
        box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    .plus-button:hover {
        background: #f5f5f5;
    }
</style>

</head>

<body>

<div class="top-bar">

    <div class="menu">

        <button class="menu-button">☰ Menu</button>

        <div class="dropdown">

            <div class="dropdown-section">
                Filters
            </div>

            <a href="#">Stationery</a>
            <a href="#">Books</a>
            <a href="#">Daily Essentials</a>
            <a href="#">Clothes</a>
            <a href="#">Others</a>

            <div class="dropdown-section">
                My History
            </div>

            <a href="#">Recently Posted</a>
            <a href="#">Recently Claimed</a>

        </div>

    </div>

</div>

<div class="content">

    <h1>HCIBS SJ Passdown</h1>

    <p>Find items passed down by your seniors.</p>

</div>

<button class="plus-button">+</button>

</body>
</html>
